<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Auto to Rental — Call</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  html,body{height:100%;background:radial-gradient(130% 130% at 50% 0%,#16305e 0%,#0a1428 55%);color:#fff;overflow:hidden}
  .wrap{height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;padding:32px;text-align:center}
  .av{width:128px;height:128px;border-radius:50%;background:linear-gradient(135deg,#1d4ed8,#3b82f6);display:flex;align-items:center;justify-content:center;font-size:54px;box-shadow:0 14px 50px rgba(29,78,216,.5);position:relative}
  .av.ring::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid rgba(96,165,250,.6);animation:pulse 1.4s ease-out infinite}
  @keyframes pulse{0%{transform:scale(1);opacity:.8}100%{transform:scale(1.45);opacity:0}}
  .name{font-size:24px;font-weight:800}
  .status{font-size:15px;color:#9fb4d6;min-height:22px}
  .timer{font-size:18px;font-weight:700;color:#7fd0a8;font-variant-numeric:tabular-nums}
  .controls{display:flex;gap:22px;margin-top:10px}
  .btn{width:68px;height:68px;border-radius:50%;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:26px;transition:transform .1s}
  .btn:active{transform:scale(.92)}
  .mute{background:rgba(255,255,255,.14);color:#fff}
  .mute.on{background:#fff;color:#0a1428}
  .hang{background:#ef4444;color:#fff;box-shadow:0 8px 26px rgba(239,68,68,.5)}
  .hint{font-size:12px;color:#6f86ab;margin-top:6px}
  .ended{font-size:17px;color:#9fb4d6}
</style>
</head>
<body>
<div class="wrap">
  <div class="av ring" id="av">🚗</div>
  <div class="name" id="name">Rental company</div>
  <div class="status" id="status">Connecting…</div>
  <div class="timer" id="timer"></div>
  <div class="controls" id="controls" style="display:none">
    <button class="btn mute" id="mute" title="Mute" aria-label="Mute">🎙️</button>
    <button class="btn hang" id="hang" title="End call" aria-label="End call">📞</button>
  </div>
  <div class="hint" id="hint">Allow microphone access to talk</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/livekit-client@2.5.7/dist/livekit-client.umd.min.js"></script>
<script>
  var API="https://api.autotorental.com", PK="pk_b9c89660573c5c7d3f54d11eb3132be59d6d919d4bb40c98b14877a2048feea1";
  var _p=new URLSearchParams(location.search);
  var room=_p.get("room")||"", vehicle=_p.get("vehicle")||"", seller=_p.get("seller")||"", title=_p.get("title")||"";
  if(title){try{document.getElementById("name").textContent=decodeURIComponent(title)}catch(e){}}
  var $=function(i){return document.getElementById(i)};
  var lkRoom=null, t0=null, timerInt=null, muted=false;
  function setStatus(s){$("status").textContent=s}
  function fmt(s){var m=Math.floor(s/60),x=s%60;return m+":"+(x<10?"0":"")+x}
  function startTimer(){t0=Date.now();timerInt=setInterval(function(){$("timer").textContent=fmt(Math.floor((Date.now()-t0)/1000))},1000)}
  function ended(msg){
    if(timerInt)clearInterval(timerInt);
    $("av").classList.remove("ring"); $("controls").style.display="none"; $("hint").style.display="none";
    $("status").innerHTML='<span class="ended">'+(msg||"Call ended")+'</span>';
    $("timer").textContent="";
    try{if(lkRoom)lkRoom.disconnect()}catch(e){}
  }
  async function start(){
    if(vehicle && seller){
      if(!room)room="veh-"+vehicle;
      setStatus("Ringing the company…");
      try{await fetch(API+"/store/calls",{method:"POST",headers:{"Content-Type":"application/json","x-publishable-api-key":PK},body:JSON.stringify({seller_id:seller,vehicle_id:vehicle,client_name:"Website caller"})});}catch(e){}
    }
    if(!room){setStatus("No call room");return}
    try{
      var r=await fetch(API+"/store/livekit/token?room="+encodeURIComponent(room),{headers:{"x-publishable-api-key":PK}});
      var d=await r.json();
      if(!r.ok||!d.token){setStatus("Couldn't start the call");$("hint").textContent=d.message||"";return}
      var LK=window.LivekitClient||window.LiveKitClient;
      lkRoom=new LK.Room({adaptiveStream:true,dynacast:true});
      lkRoom.on(LK.RoomEvent.TrackSubscribed,function(track){
        if(track.kind==="audio"){var el=track.attach();el.autoplay=true;document.body.appendChild(el);}
      });
      lkRoom.on(LK.RoomEvent.ParticipantConnected,function(p){
        $("av").classList.remove("ring"); setStatus("Connected"); $("name").textContent=p.identity&&!/guest|Guest/.test(p.identity)?p.identity:"Rental company"; if(!t0)startTimer();
      });
      lkRoom.on(LK.RoomEvent.Disconnected,function(){ended("Call ended")});
      setStatus("Ringing…");
      await lkRoom.connect(d.serverUrl,d.token);
      await lkRoom.localParticipant.setMicrophoneEnabled(true);
      $("controls").style.display="flex"; $("hint").textContent="Waiting for the company to answer…";
      if(lkRoom.remoteParticipants&&lkRoom.remoteParticipants.size>0){$("av").classList.remove("ring");setStatus("Connected");if(!t0)startTimer();}
    }catch(e){ setStatus("Call failed"); $("hint").textContent=(e&&e.message)||""; }
  }
  $("hang").onclick=function(){ended("Call ended")};
  $("mute").onclick=function(){ muted=!muted; if(lkRoom)lkRoom.localParticipant.setMicrophoneEnabled(!muted); $("mute").classList.toggle("on",muted); $("mute").textContent=muted?"🔇":"🎙️"; };
  start();
</script>
</body>
</html>
