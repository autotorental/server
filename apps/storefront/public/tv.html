<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Auto to Rental — Live TV Wall</title>
<style>
  :root{ --bg:#070d1c; --card:#0e1b35; --line:rgba(80,130,220,.18); --txt:#eaf2ff; --sub:#8fa6cc; --accent:#38bdf8; }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:radial-gradient(120% 120% at 50% 0%,#10213f 0%,#070d1c 60%);color:var(--txt);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;overflow:hidden}
  .wrap{height:100vh;display:flex;flex-direction:column;padding:3vh 3vw;gap:2.4vh}
  header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:1vh}
  .brand{display:flex;align-items:center;gap:14px}
  .live{display:inline-flex;align-items:center;gap:9px;background:#dc2626;color:#fff;font-weight:800;letter-spacing:.08em;padding:8px 16px;border-radius:999px;font-size:clamp(13px,1.4vw,18px)}
  .dot{width:11px;height:11px;border-radius:50%;background:#fff;animation:p 1.1s infinite}
  @keyframes p{0%,100%{opacity:1}50%{opacity:.25}}
  h1{font-size:clamp(18px,2.2vw,34px);font-weight:800;letter-spacing:-.02em}
  .when{color:var(--sub);font-size:clamp(12px,1.2vw,16px)}
  .kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:2vw}
  .kpi{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2.4vh 1.6vw;position:relative;overflow:hidden}
  .kpi .bar{position:absolute;inset:0 0 auto 0;height:5px}
  .kpi .lbl{color:var(--sub);font-size:clamp(11px,1.1vw,16px);font-weight:700;text-transform:uppercase;letter-spacing:.09em}
  .kpi .val{font-size:clamp(34px,5.6vw,86px);font-weight:800;line-height:1;margin-top:1.2vh;font-variant-numeric:tabular-nums}
  .grid{flex:1;display:grid;grid-template-columns:1.4fr 1fr;gap:2vw;min-height:0}
  .panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:2.2vh 1.6vw;display:flex;flex-direction:column;min-height:0}
  .panel h2{font-size:clamp(13px,1.3vw,19px);color:var(--sub);text-transform:uppercase;letter-spacing:.08em;margin-bottom:1.6vh;font-weight:800}
  .country{display:flex;align-items:center;justify-content:space-between;padding:1.3vh 0;border-bottom:1px solid var(--line);font-size:clamp(16px,1.8vw,28px)}
  .country:last-child{border-bottom:none}
  .country .l{display:flex;align-items:center;gap:14px}
  .country .flag{font-size:clamp(22px,2.4vw,38px)}
  .country .n{font-weight:800;color:var(--accent);font-variant-numeric:tabular-nums}
  .feed{flex:1;overflow:hidden;display:flex;flex-direction:column;gap:1.1vh}
  .ev{display:flex;align-items:center;gap:12px;font-size:clamp(14px,1.5vw,22px);color:#dbe8ff;opacity:0;animation:in .5s forwards}
  @keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  .ev .ago{margin-left:auto;color:var(--sub);font-size:.8em;font-variant-numeric:tabular-nums}
  .err{position:fixed;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;gap:14px;background:var(--bg);text-align:center;padding:6vw}
  .err.show{display:flex}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><span class="live"><span class="dot"></span>LIVE</span><h1>Auto&nbsp;to&nbsp;Rental — Live Traffic</h1></div>
    <div class="when" id="when">connecting…</div>
  </header>
  <div class="kpis">
    <div class="kpi"><span class="bar" style="background:#22c55e"></span><div class="lbl">Active now</div><div class="val" id="k_active">—</div></div>
    <div class="kpi"><span class="bar" style="background:#38bdf8"></span><div class="lbl">Views · 30 min</div><div class="val" id="k_v30">—</div></div>
    <div class="kpi"><span class="bar" style="background:#a855f7"></span><div class="lbl">Visitors today</div><div class="val" id="k_vis">—</div></div>
    <div class="kpi"><span class="bar" style="background:#f59e0b"></span><div class="lbl">Views today</div><div class="val" id="k_views">—</div></div>
  </div>
  <div class="grid">
    <div class="panel"><h2>Live feed</h2><div class="feed" id="feed"></div></div>
    <div class="panel"><h2>Top countries today</h2><div id="countries"></div></div>
  </div>
</div>
<div class="err" id="err"><h1 style="font-size:5vw">📺</h1><h1>Couldn't load the live feed</h1><div class="when">Check the link token. Retrying…</div></div>
<script>
  var API="https://api.autotorental.com";
  var PK="pk_b9c89660573c5c7d3f54d11eb3132be59d6d919d4bb40c98b14877a2048feea1";
  var token=new URLSearchParams(location.search).get("token")||"";
  var COUNTRY={AE:"UAE",US:"USA",GB:"UK",SG:"Singapore",CN:"China",SA:"Saudi Arabia",IN:"India",PK:"Pakistan",EG:"Egypt",SY:"Syria",FR:"France",DE:"Germany",ES:"Spain",IT:"Italy",TR:"Turkey",RU:"Russia",NL:"Netherlands",CA:"Canada",AU:"Australia",JP:"Japan",BR:"Brazil",QA:"Qatar",KW:"Kuwait",OM:"Oman",BH:"Bahrain",JO:"Jordan"};
  function cname(c){if(!c||c=="??")return "Unknown";return COUNTRY[c.toUpperCase()]||c.toUpperCase();}
  function flag(c){if(!c||c.length!=2||c=="??")return "🌍";var A=0x1f1e6;return String.fromCodePoint(A+c.toUpperCase().charCodeAt(0)-65,A+c.toUpperCase().charCodeAt(1)-65);}
  function dev(d){return d=="mobile"?"📱":d=="tablet"?"📲":"💻";}
  function human(p){if(!p||p=="/")return "the homepage";var s=p.replace(/^\/+|\/+$/g,"").split("/").filter(Boolean);var t=function(x){return x.replace(/-/g," ").replace(/\b\w/g,function(c){return c.toUpperCase()})};if(s[0]=="cars"&&s[1]=="city"&&s[2])return "Cars in "+t(s[2]);if(s[0]=="cars"&&s[1]=="brand"&&s[2])return t(s[2])+" cars";if(s[0]=="vehicle")return "a car listing";if(s[0]=="cars")return "the Cars page";if(s[0]=="blog")return "the Blog";return t(s[s.length-1]);}
  function nf(n){return Number(n||0).toLocaleString();}
  async function tick(){
    try{
      var r=await fetch(API+"/store/tv-display?token="+encodeURIComponent(token),{headers:{"x-publishable-api-key":PK}});
      if(!r.ok)throw 0;
      var d=await r.json();
      document.getElementById("err").classList.remove("show");
      document.getElementById("k_active").textContent=nf(d.active_now);
      document.getElementById("k_v30").textContent=nf(d.views_30m);
      document.getElementById("k_vis").textContent=nf(d.visitors_today);
      document.getElementById("k_views").textContent=nf(d.views_today);
      document.getElementById("when").textContent="Updated "+new Date().toLocaleTimeString();
      var cs=(d.top_countries||[]).map(function(c){return '<div class="country"><span class="l"><span class="flag">'+flag(c.country)+'</span>'+cname(c.country)+'</span><span class="n">'+nf(c.n)+'</span></div>'}).join("");
      document.getElementById("countries").innerHTML=cs||'<div class="when">No visitors yet today.</div>';
      var fs=(d.recent||[]).slice(0,9).map(function(e){return '<div class="ev"><span>'+flag(e.country)+'</span><span>'+dev(e.device)+'</span><span>New visitor from '+cname(e.country)+' — '+human(e.path)+'</span><span class="ago">'+(e.ago<60?e.ago+"s":Math.floor(e.ago/60)+"m")+' ago</span></div>'}).join("");
      document.getElementById("feed").innerHTML=fs||'<div class="when">Waiting for live visitors…</div>';
    }catch(e){ document.getElementById("err").classList.add("show"); }
  }
  tick(); setInterval(tick,6000);
  // keep the TV screen awake if supported
  if("wakeLock" in navigator){ navigator.wakeLock.request("screen").catch(function(){}); }
</script>
</body>
</html>
